name: Feature request
description: Propose an improvement aligned with the roadmap
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Likely roadmap milestone
      options:
        - Milestone 2 — Reliable Orchestration
        - Milestone 3 — Workspace Restoration
        - Milestone 4 — Activation Experience
        - Milestone 5 — Open-Source Release Quality
        - Milestone 6 — Commercial / Team Layer
        - Unclear
